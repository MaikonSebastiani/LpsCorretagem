# Worker das landing pages.
#
# ATENÇÃO: este projeto é um **Worker com assets estáticos**, não um projeto
# Pages. A convenção de /functions (um arquivo por rota) não vale aqui — o
# roteamento é feito à mão em worker/index.js.

# Precisa bater com o nome do projeto no Cloudflare. Se divergir, o wrangler
# publica em outro projeto (ou cria um novo).
name = "lpscorretagem"
main = "worker/index.js"
compatibility_date = "2026-08-23"

# Os arquivos publicados são a própria raiz do repositório. O .assetsignore
# ao lado diz o que não deve subir (código do Worker, docs, SQL).
[assets]
directory = "."
binding = "ASSETS"

# Banco dos leads, o mesmo que o CRM lê.
#
# A partir do momento em que este arquivo existe no repositório, ele é a fonte
# da verdade das configurações: bindings criados pelo painel deixam de valer.
[[d1_databases]]
binding = "DB"
database_name = "leads"
database_id = "3163576c-8b86-4d00-b586-2861cc2dbb9e"

[observability]
enabled = true

# Identidade do Cloudflare Access. Não são segredos: o AUD e o team domain
# aparecem na própria URL de redirecionamento do login, então ficam aqui em
# vez de virarem secret.
#
# Sem estas duas, /api/painel recusa tudo — falha fechado de propósito.
[vars]
ACCESS_TEAM_DOMAIN = "plain-grass-964d.cloudflareaccess.com"
ACCESS_AUD = "5e73cc2d3ef95ff7b6746b4dc8d2b9dab7430a31f4091824dd776e599508133c"
