<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sebastiani Imóveis">
  <!-- Marca provisória: monograma sobre o verde-petróleo da página.
       Duas barras a 45° sugerem o "S" sem depender de fonte — favicon
       renderiza a 16px, e letra desenhada com <text> depende da fonte
       do sistema de quem visita, que muda o resultado em cada máquina.

       Trocar por um arquivo definitivo quando existir identidade visual
       da Sebastiani. Acrescentar também os PNG (16, 32, 192, 512) e o
       apple-touch-icon: SVG cobre os navegadores atuais, mas não os
       atalhos de tela inicial no iOS. -->
  <rect width="64" height="64" rx="14" fill="#0f2d33"/>
  <path d="M43 21c-3.4-3.1-8-4.3-12.4-3.4-4 .8-6.6 3.4-6.6 6.6 0 3.6 3 5.6 8.6 7.2 6.4 1.8 9.4 4 9.4 8.2 0 4-3.2 7-8 7.8-4.6.8-9.4-.6-12.8-3.8"
        fill="none" stroke="#d99a56" stroke-width="5.4" stroke-linecap="round"/>
</svg>
